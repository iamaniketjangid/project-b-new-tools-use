name: Project B – Fast Nx CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install deps
        run: |
          cd project-b
          npm ci

      - name: Nx affected build
        run: |
          cd project-b
          npx nx affected -t build --base=HEAD~1 --head=HEAD
